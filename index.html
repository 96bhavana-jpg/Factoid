function vSummary(){
 const right=sess.res.filter(r=>r.ok).length,n=sess.res.length;
 const missed=sess.res.filter(r=>!r.ok).map(r=>CARDS[r.id]);
 const got=(sess.got||[]).map(id=>MEDALS.find(m=>m.id===id));
 app.innerHTML=`
  <div class="top"><h1>${right} of ${n}</h1>${themeBtn()}</div>
  <p class="sub">${right===n?"All correct. These move further out before you see them again."
   :missed.length===1?"One to look at again — it comes back tomorrow."
   :missed.length+" to look at again. They come back tomorrow."}</p>
  <div class="strip">
   <div class="stat"><div class="n">+${sess.gain}</div><div class="l">points</div></div>
   <div class="stat"><div class="n">${D.streak}</div><div class="l">day run</div></div>
   <div class="stat"><div class="n">${D.correct}</div><div class="l">right, all time</div></div></div>
  ${got.length?`<h2>Earned just now</h2>`+got.map(m=>`<div class="row"><span class="mark" style="background:var(--acc);border-color:var(--acc)"></span><span class="rbody"><span class="rname">${m.i} &nbsp; ${m.t}</span></span></div>`).join(""):""}
  ${missed.length?`<h2>Worth a second look</h2>`+missed.map(c=>
   `<div class="item"><div class="iq">${esc(c.q)}</div>
     <div class="im" style="color:var(--acc);font-size:14px">${esc(c.opts[c.a])}</div>
     <div class="im">${esc(c.why)}</div></div>`).join(""):""}
  <button class="btn" id="more">Another set</button>
  <button class="btn alt" id="lib">Open the library</button>`;
 wireTheme();
 document.getElementById("more").onclick=()=>{build();render();window.scrollTo(0,0);};
 document.getElementById("lib").onclick=()=>{sess=null;view="library";render();window.scrollTo(0,0);};
}

function filtered(){
 let l=met();
 if(fStar)l=l.filter(c=>D.stars.includes(c.id));
 if(fSec!=="all")l=l.filter(c=>c.sec===fSec);
 if(fQ.trim()){const q=fQ.toLowerCase();
  l=l.filter(c=>(c.q+" "+c.why+" "+c.opts.join(" ")).toLowerCase().includes(q));}
 return l;
}
function listHTML(l){
 if(!l.length)return `<div class="empty">${met().length
  ?"Nothing matches that filter."
  :"Answer a few questions and they collect here, each with its sources kept."}</div>`;
 return l.map(c=>{const s=SECS.find(x=>x.id===c.sec),k=cst(c.id);
  return `<button class="item" data-id="${c.id}"><div class="iq">${esc(c.q)}</div>
   <div class="im">${s.n} &nbsp;·&nbsp; ${k.box>=3?"settled":"still learning"} &nbsp;·&nbsp; ${k.right} of ${k.seen} right${D.stars.includes(c.id)?" &nbsp;·&nbsp; ★":""}${c.gen?" &nbsp;·&nbsp; added later":""}</div></button>`;}).join("");
}
function wireList(){document.querySelectorAll(".item[data-id]").forEach(b=>
 b.onclick=()=>{openId=+b.dataset.id;render();window.scrollTo(0,0);});}

function vLibrary(){
 app.innerHTML=`
  <div class="top"><h1>Library</h1>${themeBtn()}</div>
  <p class="sub">Every question you have answered, with its reading kept. ${met().length} so far.</p>
  <div class="tools"><input id="q" placeholder="Search questions and notes" value="${esc(fQ)}"></div>
  <div class="chips" id="ch"></div><div id="ls">${listHTML(filtered())}</div>`;
 wireTheme();
 const C=document.getElementById("ch");
 const mk=(id,label,act)=>{const b=document.createElement("button");
  b.className="chip"+(act?" on":"");b.textContent=label;
  b.onclick=()=>{if(id==="star")fStar=!fStar;else{fStar=false;fSec=id;}render();};return b;};
 C.appendChild(mk("all","All",fSec==="all"&&!fStar));
 C.appendChild(mk("star","★ Saved",fStar));
 SECS.forEach(s=>C.appendChild(mk(s.id,s.n,fSec===s.id&&!fStar)));
 const inp=document.getElementById("q");
 inp.oninput=()=>{fQ=inp.value;document.getElementById("ls").innerHTML=listHTML(filtered());wireList();};
 wireList();
}

function vCard(){
 const c=CARDS[openId],s=SECS.find(x=>x.id===c.sec),k=cst(c.id),nd=k.due-day();
 app.innerHTML=`
  <button class="pillbtn" id="bk" style="margin-bottom:14px">← Back to library</button>
  <div class="kick"><b>${s.n}</b><span>${LV[c.lvl]}</span></div>
  <p class="q">${esc(c.q)}</p>
  ${c.opts.map((o,i)=>`<div class="opt ${i===c.a?"ok":""}">${esc(o)}</div>`).join("")}
  <p class="why" style="margin-top:18px">${esc(c.why)}</p>
  ${srcHTML(c)}
  <div id="ai"></div>
  <div class="strip">
   <div class="stat"><div class="n">${k.right}/${k.seen}</div><div class="l">right</div></div>
   <div class="stat"><div class="n">${k.box}</div><div class="l">of 5 boxes</div></div>
   <div class="stat"><div class="n">${nd<=0?"now":nd+"d"}</div><div class="l">next review</div></div></div>
  <button class="pillbtn ${D.stars.includes(c.id)?"on":""}" id="st">${D.stars.includes(c.id)?"★ Saved":"☆ Save this one"}</button>`;
 mountAI(c,"ai");
 document.getElementById("bk").onclick=()=>{openId=null;render();window.scrollTo(0,0);};
 document.getElementById("st").onclick=()=>{
  D.stars=D.stars.includes(c.id)?D.stars.filter(x=>x!==c.id):D.stars.concat(c.id);save();render();};
}

function vProgress(){
 const seen=met(),tries=seen.reduce((n,c)=>n+cst(c.id).seen,0);
 const acc=tries?Math.round(D.correct/tries*100):0;
 app.innerHTML=`
  <div class="top"><h1>Progress</h1>${themeBtn()}</div>
  <p class="sub">${seen.length} of ${CARDS.length} questions met, ${acc}% right across ${tries} answers.</p>
  <div class="strip">
   <div class="stat"><div class="n">${D.points}</div><div class="l">points</div></div>
   <div class="stat"><div class="n">${D.streak}</div><div class="l">day run</div></div>
   <div class="stat"><div class="n">${D.best||D.streak}</div><div class="l">best run</div></div></div>
  <h2>Where you stand</h2><div id="bars"></div>
  <h2>Marks earned</h2>
  <div class="medals">${MEDALS.map(m=>`<div class="medal ${D.medals.includes(m.id)?"won":""}">
   <div class="m">${m.i}</div><div class="t">${m.t}</div></div>`).join("")}</div>
  <hr>
  <h2>Ask about answers</h2>
  <div id="keyzone"></div>
  <hr>
  <p class="note">Progress is stored on this device only. Saving this page to your phone's home screen keeps everything.</p>
  <button class="btn alt" id="rs">Clear all progress</button>`;
 wireTheme();
 const B=document.getElementById("bars");
 SECS.forEach(s=>{const n=inS(s.id).length,g=gotN(s.id);
  const d=document.createElement("div");d.className="row";
  d.innerHTML=`<span class="mark" style="background:var(--acc);border-color:var(--acc)"></span>
   <span class="rbody"><span class="rname">${s.n}</span>
   <span class="bar"><i style="width:${n?Math.round(g/n*100):0}%"></i></span></span>
   <span class="rright">${g}/${n}</span>`;B.appendChild(d);});
 const KZ=document.getElementById("keyzone");
 AI.host().then(h=>{
  if(h){KZ.innerHTML='<p class="note">Follow-up questions are answered through Claude in this view. Nothing to set up.</p>';return;}
  const drawKey=()=>{
   const gem=D.prov!=="claude";
   KZ.innerHTML=
    '<div class="starters" style="margin-bottom:10px">'+
     '<button class="starter'+(gem?" pick":"")+'" data-p="gemini">Gemini — free</button>'+
     '<button class="starter'+(gem?"":" pick")+'" data-p="claude">Claude — paid</button></div>'+
    '<p class="note">'+(gem
      ? 'Free, and no card needed. Go to aistudio.google.com, sign in with a Google account, choose Get API key, and paste it below. The free tier allows a few requests a minute, which is plenty here. Google may use free-tier prompts to improve its models, so keep anything confidential out of the follow-up box.'
      : 'Paid by usage, a fraction of a penny per question. Create a key at console.anthropic.com and add a little credit first.')+
     ' The key is kept in this browser only — never uploaded, never written into the page file.</p>'+
    '<div class="keybox">'+
     (gem
      ? '<input id="gk" type="password" placeholder="AIza..." value="'+esc(D.gkey||"")+'">'+
        '<input id="gm" placeholder="Model (gemini-2.5-flash)" value="'+esc(D.gmodel||"")+'">'
      : '<input id="k" type="password" placeholder="sk-ant-..." value="'+esc(D.key||"")+'">'+
        '<input id="m" placeholder="Model (claude-sonnet-5)" value="'+esc(D.model||"")+'">')+
     '<button class="btn" id="ks" style="margin-top:0">Save key</button>'+
     '<p class="hint" id="kmsg"></p></div>';
   KZ.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{D.prov=b.dataset.p;save();drawKey();});
   KZ.querySelector("#ks").onclick=async()=>{
    if(gem){D.gkey=KZ.querySelector("#gk").value.trim();D.gmodel=KZ.querySelector("#gm").value.trim();}
    else{D.key=KZ.querySelector("#k").value.trim();D.model=KZ.querySelector("#m").value.trim();}
    await save();
    const msg=KZ.querySelector("#kmsg"),btn=KZ.querySelector("#ks");
    btn.textContent="Saved";
    const has=gem?D.gkey:D.key;
    if(!has){msg.textContent="Cleared.";return;}
    msg.textContent="Checking the key…";
    try{
     let chose="";
     if(gem&&!D.gmodel){ chose=await AI.pickModel(); }
     await AI.ask([{role:"user",content:"Reply with the single word: ready"}],
       "You are a connection test. Reply with one word.");
     msg.textContent="Working"+((gem&&(chose||D.gmodel))?(", using "+(chose||D.gmodel)):"")+
       ". Follow-up questions are switched on.";
    }catch(e){
     const detail=e&&e.message?String(e.message).slice(0,180):"";
     msg.textContent = e&&e.code==="bad_key" ? "That key was rejected — check it and try again."
       : e&&e.code==="rate_limited" ? "Key accepted, but the free tier is busy. Try a question in a minute."
       : e&&e.code==="model" ? ("No usable model found for this key. "+detail)
       : ("Saved, but the test call failed. "+detail);
    }
   };
  };
  drawKey();
 });
 document.getElementById("rs").onclick=()=>{
  if(confirm("Clear every box, point and mark? This cannot be undone.")){
   const t=D.theme,k=D.key,m=D.model,pv=D.prov,gk=D.gkey,gm=D.gmodel,cu=D.custom||[];
   D={cards:{},off:[],streak:0,best:0,last:null,points:0,correct:0,perfect:0,bestRun:0,medals:[],stars:[],theme:t,prov:pv,key:k,model:m,gkey:gk,gmodel:gm,chats:{},custom:cu};
   makeCards();
   save();render();}};
}

(async function(){
 try{const raw=await Store.get(KEY);if(raw)D=Object.assign(D,JSON.parse(raw));}catch(e){}
 if(!Array.isArray(D.custom))D.custom=[];
 makeCards();
 render();
})();
</script>
</body>
</html>
