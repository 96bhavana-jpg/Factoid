<title>Factoid</title>
<style>
:root{
  --bg:#F6F3EC; --panel:#FFFDF9; --panel2:#EDE8DE;
  --text:#171512; --soft:#6A6357; --line:#E0D9CB;
  --acc:#5E7F94; --acc-ink:#FBFAF7; --acc-soft:#E6EDF1;
  --gold:#8A6D22; --gold-soft:#F0E7D2;
  --btn:#171512; --btn-ink:#F6F3EC;
  --bad:#8B3623; --bad-soft:#F2E4DF;
  --serif:"Source Serif 4","Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:var(--serif);
}
html[data-theme="dark"]{
  --bg:#131211; --panel:#1C1A18; --panel2:#262320;
  --text:#EFEAE0; --soft:#9B9488; --line:#2E2A25;
  --acc:#A9C6D8; --acc-ink:#141C21; --acc-soft:#1D262C;
  --gold:#C7A75E; --gold-soft:#2A241A;
  --btn:#EFEAE0; --btn-ink:#131211;
  --bad:#DE8C74; --bad-soft:#2C1D18;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.55;
  padding:18px 16px calc(94px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
.wrap{max-width:34rem;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1{font-family:var(--serif);font-size:28px;line-height:1.15;margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:14px;margin:26px 0 10px;color:var(--soft);font-weight:600}
.sub{color:var(--soft);font-size:15px;margin:0 0 18px}

.top{display:flex;align-items:flex-start;gap:12px;margin-bottom:4px}
.top h1{flex:1}
.theme{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12.5px;color:var(--soft);white-space:nowrap}

.strip{display:flex;gap:9px;margin:0 0 18px}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.stat .n{font-family:var(--serif);font-size:24px;line-height:1.1;color:var(--acc)}
.stat .l{font-size:12px;color:var(--soft);margin-top:2px}

.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.row[aria-pressed="false"]{opacity:.5}
.mark{flex:none;width:16px;height:16px;border-radius:5px;border:1.5px solid var(--soft)}
.row[aria-pressed="true"] .mark{background:var(--acc);border-color:var(--acc)}
.rbody{flex:1;min-width:0}
.rname{font-size:15.5px;line-height:1.3}
.bar{height:5px;background:var(--panel2);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.rright{flex:none;font-size:13px;color:var(--soft);text-align:right;min-width:54px}
.rright b{color:var(--acc)}

.btn{display:block;width:100%;background:var(--acc);color:var(--acc-ink);border-radius:14px;
  padding:15px;font-size:16.5px;font-weight:700;text-align:center;margin-top:18px}
.btn.alt{background:var(--panel);color:var(--text);border:1px solid var(--line);font-weight:600}

.ticks{display:flex;gap:3px;margin-bottom:18px}
.tick{flex:1;height:5px;background:var(--panel2);border-radius:3px}
.tick.ok{background:var(--acc)} .tick.no{background:var(--bad)} .tick.now{background:var(--soft)}
.kick{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--soft);margin-bottom:12px}
.kick b{color:var(--text);font-weight:600}
.q{font-family:var(--serif);font-size:23px;line-height:1.35;margin:0 0 18px}
.opt{display:block;width:100%;text-align:left;background:var(--panel);border:1.5px solid var(--line);
  border-radius:12px;padding:14px;margin-bottom:9px;font-size:16px;line-height:1.45}
.opt.ok{border-color:var(--acc);background:var(--acc-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default;opacity:1}

.verdict{display:flex;align-items:center;gap:11px;margin:20px 0 12px}
.seal{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:19px;font-weight:700;background:var(--acc);color:var(--acc-ink);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.seal.bad{background:var(--bad);color:#fff}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.vt{font-weight:700;font-size:16px}
.vt small{display:block;font-weight:400;font-size:14px;color:var(--soft);margin-top:1px}
.pts{margin-left:auto;color:var(--acc);font-weight:700;font-size:16px}
.why{font-size:17px;line-height:1.65;margin:0 0 16px}

.src{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 14px;margin-bottom:14px}
.src h3{font-size:12px;color:var(--soft);margin:11px 0 4px;font-weight:600}
.src a{display:block;color:var(--text);text-decoration:none;font-size:15px;line-height:1.4;
  padding:11px 0;border-top:1px solid var(--line)}
.src a:first-of-type{border-top:0}
.src a em{display:block;font-style:normal;font-size:12.5px;color:var(--soft);margin-top:3px}
.src a b{color:var(--acc);font-weight:600}

.pillbtn{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:9px 15px;
  font-size:14px;color:var(--soft);margin-bottom:6px;background:var(--panel)}
.pillbtn.on{color:var(--acc);border-color:var(--acc)}

.tools input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
  border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;margin-bottom:10px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:13.5px;
  background:var(--panel);color:var(--soft);white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.item{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:13px 14px;margin-bottom:8px}
.item .iq{font-family:var(--serif);font-size:16.5px;line-height:1.35}
.item .im{font-size:12.5px;color:var(--soft);margin-top:6px}
.empty{color:var(--soft);font-size:15px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:20px;text-align:center}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px}
.medal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 8px;text-align:center;opacity:.45}
.medal.won{opacity:1;border-color:var(--acc)}
.medal .m{font-size:20px;margin-bottom:6px;color:var(--soft)}
.medal.won .m{color:var(--acc)}
.medal .t{font-size:11.5px;line-height:1.3;color:var(--soft)}
.medal.won .t{color:var(--text)}

nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);
  border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;font-size:13px;color:var(--soft);padding:6px 0}
nav button.on{color:var(--text);font-weight:700}
nav button.on::after{content:"";display:block;width:16px;height:2px;background:var(--gold);margin:4px auto 0;border-radius:2px}
/* --- restraint: ink buttons, brass used sparingly --- */
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2,.rname,.q,.iq,.stat .n,.vt{letter-spacing:-.005em}
h2{text-transform:uppercase;letter-spacing:.08em;font-size:12px}
.btn{background:var(--btn);color:var(--btn-ink)}
.btn.alt{background:transparent;color:var(--text);border:1px solid var(--line)}
.chip.on{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.pts{color:var(--gold)}
.pillbtn.on{color:var(--gold);border-color:var(--gold)}
.medal.won{border-color:var(--gold)}
.medal.won .m{color:var(--gold)}
.stat .n{font-weight:600}
.theme{font-size:13px}

/* --- follow-up conversation --- */
.ai{border:1px solid var(--line);border-radius:14px;background:var(--panel);
  padding:14px;margin-bottom:14px}
.ai h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--soft);
  margin:0 0 10px;font-weight:600}
.starters{display:flex;flex-wrap:wrap;gap:6px}
.starter.pick{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.starter{border:1px solid var(--line);background:var(--panel2);border-radius:999px;
  padding:7px 12px;font-size:14px;color:var(--soft);line-height:1.3}
.thread{margin:2px 0}
.bub{font-size:16px;line-height:1.6;margin:14px 0}
.bub.me{color:var(--soft);border-left:2px solid var(--line);padding-left:11px}
.bub.ai{white-space:pre-wrap}
.bub.ai.wait{color:var(--soft);font-style:italic}
.askrow{display:flex;gap:8px;align-items:center;margin-top:12px}
.askrow input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);
  color:var(--text);border-radius:10px;padding:11px 12px;font:inherit;font-size:15px}
.askrow button{flex:none;background:var(--btn);color:var(--btn-ink);border-radius:10px;
  padding:11px 15px;font-size:15px;font-weight:600}
.askrow button:disabled{opacity:.45}
.ai .hint{font-size:13px;color:var(--soft);line-height:1.5;margin:10px 0 0}
.keybox{margin-top:10px}
.keybox input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:11px 12px;font:inherit;font-size:14px;margin-bottom:8px}

hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.note{font-size:13px;color:var(--soft);line-height:1.5}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav id="nav"></nav>
<script>
"use strict";

/* ---------- storage: works in a browser, in Claude, or neither ---------- */
const Store=(()=>{
  let mode="memory",mem={};
  try{const k="__t";localStorage.setItem(k,"1");localStorage.removeItem(k);mode="local";}catch(e){
    if(typeof window!=="undefined"&&window.storage)mode="host";}
  return{
    async get(k){
      if(mode==="local")return localStorage.getItem(k);
      if(mode==="host"){try{const r=await window.storage.get(k);return r&&r.value;}catch(e){return null;}}
      return mem[k]||null;},
    async set(k,v){
      if(mode==="local"){try{localStorage.setItem(k,v);return;}catch(e){}}
      if(mode==="host"){try{await window.storage.set(k,v);return;}catch(e){}}
      mem[k]=v;},
    mode};
})();

/* India: government and law */
["gov",1,"What is the largest the Lok Sabha can be under the Constitution?",["500","545","550","552"],2,
 "The Constitution allows 530 seats for the states and 20 for the union territories. The ceiling used to be 552, because two more members were nominated to represent the Anglo-Indian community; that practice was ended in 2020, so 550 is the number now.",["coi","prsMoney"]],
["gov",1,"Which Part of the Constitution contains the Fundamental Rights?",["Part II","Part III","Part IV","Part V"],1,
 "Part III, Articles 12 to 35. What makes them real is Article 32, which lets you go straight to the Supreme Court when one is breached. Ambedkar called that article the heart and soul of the whole document.",["coi32","kanoon32"]],
["gov",2,"Directive Principles differ from Fundamental Rights because they are:",["Applicable only to states","Not enforceable in court","Changed by simple majority","Limited to economic matters"],1,
 "Fundamental Rights are things you can sue over. Directive Principles, in Part IV, are instructions to government about what to aim for — free legal aid, a living wage, environmental protection — with no court to enforce them. Judges now often read the two together.",["coi","sco"]],
["gov",1,"A money bill can be introduced only in:",["The Rajya Sabha","The Lok Sabha","Either House","A joint sitting"],1,
 "The Rajya Sabha can suggest changes but must send the bill back within 14 days, and the Lok Sabha can ignore what it says. The Speaker decides what qualifies as a money bill, which is why governments are sometimes accused of using the label to bypass the upper house.",["prsMoney","sco"]],
["gov",2,"How many judges can the Supreme Court of India have?",["26","31","34","41"],2,
 "The Chief Justice plus 33 others, a number Parliament raised in 2019 to clear a backlog. The Court almost never sits as a whole; it works in benches of two or three, which is why different benches can end up saying different things.",["sco","kanoon32"]],
["gov",2,"Which Article lets the President declare a national emergency?",["352","356","360","368"],0,
 "Article 352 covers a national emergency, 356 lets the Centre take over a state government, and 360 covers a financial emergency. The first two have been used; the third never has.",["prsEmerg","coi"]],
["gov",2,"'Socialist', 'secular' and 'integrity' were added to the Preamble by:",["The 42nd Amendment, 1976","The 44th Amendment, 1978","The 52nd Amendment, 1985","The 73rd Amendment, 1992"],0,
 "This came during the Emergency, in an amendment so sweeping it is sometimes called a second constitution. A later government reversed much of it, but left these three words in place, and they remain there today.",["coi","sco"]],
["gov",2,"Village and district councils got constitutional protection through:",["The 61st Amendment","The 73rd Amendment","The 86th Amendment","The 97th Amendment"],1,
 "The 73rd Amendment in 1992 for rural bodies, the 74th for urban ones. They guaranteed regular elections and reserved seats, but left it to each state to decide how much money and staff to hand down — which is why panchayats are powerful in some states and nominal in others.",["prsPanch","idr"]],
["gov",1,"The Eighth Schedule of the Constitution lists:",["Union and state subjects","Official languages","Anti-defection rules","Tribal areas"],1,
 "Twenty-two languages. Being on the list affects which languages can be used in exams, courts and official business, so getting a language added is a recurring political campaign.",["coi","sahitya"]],
["gov",2,"Which body recommends how tax revenue is divided between the Centre and the states?",["NITI Aayog","The Finance Commission","The Reserve Bank","The CAG"],1,
 "A new Finance Commission is set up roughly every five years. It decides what share of central taxes goes to states and how that pool is split between them — a formula that quietly determines how much money each state government has to spend.",["fincom","prsGST"]],
["gov",3,"The anti-defection law is found in:",["The Fifth Schedule","The Seventh Schedule","The Ninth Schedule","The Tenth Schedule"],3,
 "Added in 1985 to stop legislators switching parties for gain. It works imperfectly: group defections are treated differently from individual ones, and because the Speaker decides disqualification cases, simply not deciding has become a tactic.",["prsDefect","sco"]],
["gov",2,"The Election Commission's powers come from:",["Article 280","Article 324","Article 356","Ordinary legislation only"],1,
 "Article 324 gives it charge of elections to Parliament, state legislatures, and the offices of President and Vice-President. Local body elections are run by separate state election commissions.",["eci","sco"]],
["gov",2,"A state Governor is:",["Elected by the state legislature","Appointed by the President","Chosen by the Chief Minister","Elected by voters"],1,
 "Appointed on the advice of the Union government, and removable by it. Because the Governor also decides things like when to sign a state bill or whom to invite to form a government, the office is a standing flashpoint between Delhi and the states.",["coi","sco"]],
["gov",3,"The basic structure doctrine says Parliament cannot:",["Amend the Constitution at all","Alter its essential features","Pass retrospective laws","Override state legislatures"],1,
 "From Kesavananda Bharati in 1973, decided 7 to 6. Parliament can amend the Constitution, but not so far as to destroy features like democracy, secularism or judicial review. Several other countries' courts have since borrowed the idea.",["kesav","sco"]],
["gov",2,"Public interest litigation in India allows:",["Only affected parties to sue","Anyone acting in the public interest to petition for others","Class action damages","Suits against private firms only"],1,
 "From the late 1970s the courts relaxed the rule that only an injured party could come to them, so that a letter about prison conditions could become a case. It opened the courts to people who could never have reached them, and also drew judges deep into governance.",["scoPIL","sco"]],

/* India: economy */
["eco",1,"Who decides India's policy interest rate?",["The Finance Ministry","The RBI Governor alone","The Monetary Policy Committee","NITI Aayog"],2,
 "A six-person committee: three from the Reserve Bank, three appointed from outside, with the Governor breaking ties. It was set up in 2016 so that rate decisions would rest on a documented vote rather than one person's judgement.",["rbiMPC","rbiFrame"]],
["eco",2,"India's inflation target is:",["2%, ±1","4%, ±2","5%, ±2","6% flat"],1,
 "Four per cent consumer price inflation, with two points of tolerance either side. If inflation stays outside that band for three quarters in a row, the Reserve Bank has to write to the government explaining why and what it will do.",["rbiFrame","ifi"]],
["eco",1,"NITI Aayog replaced which body in 2015?",["The Planning Commission","The Finance Commission","The National Development Council","The Central Statistical Office"],0,
 "The Planning Commission handed out money to states; NITI Aayog does not. It advises, publishes rankings that put states in competition with one another, and convenes — so its influence depends on persuasion rather than a budget.",["ifi","survey"]],
["eco",1,"GST came into force on:",["1 April 2016","1 July 2017","1 April 2018","1 January 2019"],1,
 "It replaced a tangle of central and state indirect taxes with one system. Rates are set by a council where the Centre and the states vote together, which makes GST one of the few genuinely joint fiscal institutions India has.",["prsGST","survey"]],
["eco",2,"Which sector produces the largest share of India's GDP?",["Agriculture","Manufacturing","Services","Construction"],2,
 "Services, at more than half. Most countries got rich by moving workers from farms into factories first; India grew on services instead, which is why creating manufacturing jobs is such a persistent worry in Indian policy.",["ifiJobs","owidGrowth"]],
["eco",2,"Which sector employs the largest share of India's workers?",["Agriculture","Manufacturing","Services","Mining"],0,
 "Farming still employs around two-fifths of workers while producing under a fifth of output. That mismatch is another way of saying farm incomes are low, and it is the single biggest structural problem in the Indian economy.",["ifiJobs","census"]],
["eco",1,"MGNREGA guarantees each rural household:",["50 days of paid work a year","100 days of paid work a year","180 days of paid work a year","Unlimited work"],1,
 "A hundred days of manual work at a notified wage, available on demand — and an allowance if the state fails to provide it. Because people only turn up when nothing better is available, demand for the scheme doubles as a measure of rural distress.",["ifiMgn","jpal"]],
["eco",1,"India's financial year runs:",["January to December","April to March","July to June","October to September"],1,
 "Budgets, company results and government schemes all follow this cycle, so 'FY25' means the year ending in March 2025 — worth pinning down before reading any Indian figure.",["survey"]],
["eco",2,"The last completed Census of India was in:",["2001","2011","2021","2026"],1,
 "Almost every Indian statistic is anchored to the census: constituency boundaries, survey samples, welfare lists. The longer the gap since the last count, the more of that machinery is running on estimates.",["census","ifi"]],
["eco",2,"The 'demographic dividend' means:",["A payment to young families","Growth potential from a large working-age population","Falling infant mortality","Rising life expectancy"],1,
 "For a few decades a country has proportionally more workers than dependants, which can lift growth. It only pays out if those workers are educated, healthy and employed. India's low rate of women in paid work is the biggest leak in the system.",["owidPop","hdr"]],
["eco",1,"UPI is run by:",["The Reserve Bank","NPCI","SEBI","State Bank of India"],1,
 "The National Payments Corporation of India, a not-for-profit owned by banks. The design decision that mattered was interoperability: any app can pay any other, so no single company owns the network.",["npci","ifi"]],
["eco",3,"The 'twin balance sheet problem' means stress in:",["Households and small firms","Banks and heavily indebted companies","State and central budgets","Imports and exports"],1,
 "After the investment boom of the 2000s, big infrastructure companies could not repay, and the same debts sat as bad loans on bank books. Two damaged balance sheets facing each other froze new lending for years.",["survey","ifi"]],
["eco",2,"The Insolvency and Bankruptcy Code was passed in:",["2013","2016","2018","2020"],1,
 "It created a fixed-timetable process for rescuing or winding up failing companies, and crucially took control away from owners who had defaulted. Whether it works now depends mostly on how backed-up the tribunals are.",["survey","ifi"]],
["eco",2,"Direct Benefit Transfer was mainly intended to:",["Increase subsidy spending","Cut leakage by paying people directly","Replace all in-kind welfare","Move welfare to the states"],1,
 "Paying money into a bank account removes several hands it used to pass through. It reduces some theft, but creates a new risk: people whose records do not match get excluded entirely.",["jpalDBT","ifi"]],

/* India: history */
["his",2,"Which Indus site in Gujarat is known for its dockyard?",["Kalibangan","Lothal","Dholavira","Rakhigarhi"],1,
 "Lothal's brick basin is usually read as a dock, evidence that Indus cities traded by sea with Mesopotamia. Dholavira, also in Gujarat, is famous instead for its reservoirs — water engineering on a scale nothing nearby matched.",["harappa","asi"]],
["his",3,"Ashoka's rock edicts were deciphered in 1837 by:",["William Jones","James Prinsep","Alexander Cunningham","John Marshall"],1,
 "Prinsep cracked the Brahmi script, and an emperor who had dropped out of historical memory suddenly had a voice. Nearly everything we know about Mauryan rule comes from those inscriptions.",["asi","harappa"]],
["his",1,"The Battle of Plassey was fought in:",["1707","1757","1764","1784"],1,
 "Clive won it largely by arranging for part of the Nawab's army not to fight. Bengal's revenues then funded further conquest, which is how a trading company became a territorial power.",["plassey","bl"]],
["his",2,"The revolt of 1857 began at:",["Meerut","Kanpur","Jhansi","Barrackpore"],0,
 "Sepoys at Meerut mutinied and marched on Delhi, where they declared the ageing Mughal emperor their sovereign. When it was crushed, the East India Company was abolished and India passed to direct Crown rule.",["bl","plassey"]],
["his",1,"The Indian National Congress was founded in:",["1857","1885","1905","1919"],1,
 "It began as a respectable annual gathering that petitioned the government, helped along by a retired British official, A.O. Hume. Only decades later, under Gandhi, did it become a mass organisation.",["bl","gandhi"]],
["his",2,"Gandhi's first satyagraha in India was at:",["Kheda","Champaran","Ahmedabad","Bardoli"],1,
 "In 1917 he went to Champaran in Bihar, where planters forced tenants to grow indigo. He took testimony, refused to leave when ordered, and won. The method — a specific local injustice, documented, met with disciplined refusal — became his template.",["gandhiChamp","gandhi"]],
["his",1,"The Dandi March of 1930 was aimed at:",["The land tax","The salt tax","The Rowlatt Act","Partition of Bengal"],1,
 "Gandhi walked 240 miles to the sea and picked up salt, breaking a law that taxed something nobody could do without. The genius was the choice of target: no explanation was needed for anyone, anywhere.",["gandhi","bl"]],
["his",1,"Quit India was launched in:",["1930","1935","1942","1945"],2,
 "Congress demanded immediate British withdrawal in the middle of the war. The leadership was jailed within hours, and what followed was a leaderless, often violent, uprising — which showed how far ordinary sentiment had run ahead of the leaders.",["gandhi","bl"]],
["his",2,"The India-Pakistan boundary of 1947 was drawn by:",["Lord Mountbatten","Cyril Radcliffe","Stafford Cripps","Clement Attlee"],1,
 "A London barrister who had never been to India, given about five weeks and out-of-date maps. The lines were published after independence, so millions discovered which country they were in only once the violence had begun.",["partition","bl"]],
["his",1,"The Constitution's Drafting Committee was chaired by:",["Nehru","Rajendra Prasad","B.R. Ambedkar","Sardar Patel"],2,
 "Rajendra Prasad chaired the Constituent Assembly; Ambedkar chaired the committee that turned three years of debate into text, and defended almost every clause of it on the floor.",["coi","coi32"]],
["his",2,"India's Green Revolution is associated above all with:",["M.S. Swaminathan","Verghese Kurien","Vikram Sarabhai","Homi Bhabha"],0,
 "Swaminathan, working with Norman Borlaug's high-yield wheat in Punjab and Haryana from the mid-1960s. It ended the era of famine and food aid, and left behind depleted groundwater and a narrow, subsidised crop mix.",["ifi","owidGrowth"]],
["his",2,"The 1991 reforms were carried out under:",["Rajiv Gandhi and V.P. Singh","Narasimha Rao and Manmohan Singh","Vajpayee and Yashwant Sinha","Indira Gandhi and C. Subramaniam"],1,
 "India had weeks of foreign exchange left and had to pledge gold abroad. In months, industrial licensing was dismantled, tariffs cut and the rupee devalued — reforms long argued for that only a crisis made possible.",["ifi91","survey"]],

/* India: land */
["lan",2,"The longest river flowing entirely inside India is:",["The Ganga","The Godavari","The Narmada","The Krishna"],1,
 "The Ganga is longer, but it crosses into Bangladesh. The Godavari runs about 1,465 km from the Western Ghats across the Deccan to the Bay of Bengal, which makes it the longest river India keeps to itself.",["soi"]],
["lan",2,"The southernmost point of Indian territory is:",["Kanyakumari","Rameswaram","Indira Point","Minicoy"],2,
 "Indira Point sits at the tip of Great Nicobar, far out in the Bay of Bengal. Kanyakumari is the southernmost point of the mainland — the distinction the question turns on.",["soi"]],
["lan",1,"Which state has India's longest coastline?",["Tamil Nadu","Andhra Pradesh","Gujarat","Maharashtra"],2,
 "Gujarat, at roughly 1,600 km, because its coast is so deeply indented by gulfs and creeks. That coastline is a large part of why so many of India's ports and refineries are there.",["soi","survey"]],
["lan",2,"Which state borders Nepal, Bhutan and Bangladesh?",["Sikkim","Assam","West Bengal","Bihar"],2,
 "West Bengal stretches from the Himalayas to the sea. At its narrowest, near Siliguri, it is barely 20 km wide — the only land route between the north-east and the rest of India, which is why that corridor comes up in every strategic discussion.",["soi","orfQuad"]],
["lan",3,"The Tropic of Cancer crosses how many Indian states?",["5","6","8","10"],2,
 "Eight: Gujarat, Rajasthan, Madhya Pradesh, Chhattisgarh, Jharkhand, West Bengal, Tripura and Mizoram. It runs roughly along the line where the tropical south gives way to the subtropical north.",["soi"]],
["lan",3,"The highest mountain lying entirely within India is:",["Kangchenjunga","Nanda Devi","K2","Saltoro Kangri"],1,
 "Nanda Devi, 7,816 m, in Uttarakhand. Kangchenjunga is higher but sits on the Nepal border, which is what makes this question a trap.",["soi"]],
["lan",1,"The Sundarbans is the delta of:",["The Indus","The Ganga, Brahmaputra and Meghna","The Mahanadi","The Godavari and Krishna"],1,
 "Three great rivers meeting the sea, creating the largest mangrove forest in the world, shared with Bangladesh. It shelters tigers and absorbs cyclones, and is being eaten away by rising seas and salt.",["unescoSund","soi"]],
["lan",1,"India's largest state by area is:",["Madhya Pradesh","Rajasthan","Maharashtra","Uttar Pradesh"],1,
 "Rajasthan is largest by area; Uttar Pradesh is largest by population, with more people than Brazil. Mixing up the two is one of the commonest slips.",["census","soi"]],
["lan",1,"The south-west monsoon usually reaches the mainland first at:",["Kerala","Konkan","Bengal","Gujarat"],0,
 "Around 1 June at the Kerala coast, then north over about six weeks. For farmers what matters is not the season's total rainfall but when it arrives and whether it keeps arriving.",["imd","ifi"]],
["lan",2,"How many countries share a land border with India?",["5","6","7","9"],2,
 "Seven: Pakistan, China, Nepal, Bhutan, Bangladesh, Myanmar and Afghanistan. Sri Lanka and the Maldives are close neighbours but only by sea.",["soi","orfQuad"]],
["lan",2,"The Western Ghats matter chiefly because they:",["Divide India from Pakistan","Catch the monsoon and hold rare biodiversity","Contain India's highest peaks","Form the northern watershed"],1,
 "The range forces monsoon winds upward, which is what makes the west coast so wet and feeds the rivers of the peninsula. It is also one of the world's richest concentrations of species found nowhere else.",["unescoGhats","imd"]],

/* World: history and politics */
["wor",1,"The Speaker of the House of Commons is expected to:",["Lead the largest party","Give up party allegiance and chair impartially","Advise the monarch","Sit in Cabinet"],1,
 "On taking the chair the Speaker resigns from their party and stops voting except to break a tie. By convention the main parties then don't campaign against them at elections, so impartiality doesn't cost the seat.",["ukparlSpeaker","hclib"]],
["wor",2,"Under the Parliament Acts, the House of Lords can:",["Veto any bill","Delay most bills but not block them for good","Rewrite money bills","Dissolve the Commons"],1,
 "The rule was settled after the Lords rejected a budget in 1909. Today the Lords can hold a bill up for about a year, which in practice means forcing concessions rather than stopping the government.",["ifgLords","hclib"]],
["wor",1,"Prime Minister's Questions happens:",["Daily","Weekly, on Wednesdays","Fortnightly","Only in budget season"],1,
 "Half an hour, with the Leader of the Opposition allowed six questions. It is mostly performance, but it is also the one fixed moment each week when a prime minister must answer without a script.",["ukparlSpeaker","hclib"]],
["wor",1,"A 'hung parliament' means:",["The government has resigned","No party has an overall majority","Parliament is dissolved","A confidence vote failed"],1,
 "Nobody can command the Commons alone, so the result is a coalition, a deal for support on key votes, or a minority government that negotiates each time. Under first-past-the-post it is unusual, which is why it causes such confusion when it happens.",["hclibHung","ifgCab"]],
["wor",2,"Collective cabinet responsibility means ministers must:",["Vote as they see fit","Publicly back cabinet decisions or resign","Answer only to the PM","Share one department"],1,
 "You can argue inside the room; once the decision is made you defend it or leave. It is a convention rather than a law, and it has been formally suspended before — for the European referendums of 1975 and 2016.",["ifgCab","hclib"]],
["wor",1,"The Berlin Wall fell in:",["1985","1989","1991","1993"],1,
 "1989 — brought down by a chaotic press conference and a crowd that took a border guard's hesitation as permission. The Soviet Union itself lasted another two years, dissolving at the end of 1991.",["wilsonWall","wilson"]],
["wor",2,"The Marshall Plan was:",["A NATO defence pact","American aid to rebuild western Europe after 1945","A currency union","A decolonisation plan"],1,
 "About $13 billion over four years, on one condition: the Europeans had to agree among themselves how to divide it. That forced cooperation is the seed from which today's European Union grew.",["truman","wilson"]],
["wor",3,"In 1971 the United States ended:",["The dollar's convertibility into gold","The Bretton Woods institutions","Trade with China","Capital controls"],0,
 "Nixon cut the last link between the dollar and gold, and the system of fixed exchange rates collapsed with it. Every floating currency and every currency crisis since dates from that decision.",["bis1971","imfBasics"]],
["wor",2,"The UK formally left the European Union on:",["23 June 2016","29 March 2019","31 January 2020","31 December 2020"],2,
 "Three dates get muddled: the referendum was June 2016, departure was 31 January 2020, and the transition period — during which little changed in practice — ran to the end of that year.",["hclib","eu"]],
["wor",2,"Which EU institution is directly elected?",["The Commission","The European Council","The European Parliament","The Council of Ministers"],2,
 "Voters elect the Parliament. The Commission, which proposes laws, is appointed, and national ministers decide alongside Parliament. Arguments about the EU's 'democratic deficit' are arguments about that split.",["eu","hclib"]],
["wor",1,"How many electoral college votes win a US presidency?",["218","270","300","435"],1,
 "270 of 538. Nearly every state gives all its votes to whoever wins there, so a candidate can take the White House while losing the national popular vote — which has happened twice this century.",["usna","cfr"]],
["wor",1,"The Universal Declaration of Human Rights was adopted in:",["1945","1948","1950","1966"],1,
 "1948, drafted by a committee chaired by Eleanor Roosevelt. It is a declaration, not a treaty — nobody can be sued under it. The binding covenants came eighteen years later, and it is worth reading how short it is.",["udhr"]],
["wor",2,"The Treaty of Versailles was signed in:",["1914","1918","1919","1920"],2,
 "The fighting stopped in November 1918; the treaty came the following June. Its reparations and its assignment of blame to Germany are the standard example of how a settlement can carry the next war inside it.",["iwm","wilson"]],
["wor",2,"NATO's Article 5 says that:",["Members must spend 2% of GDP on defence","An attack on one is an attack on all","Decisions are by majority vote","Members cannot join other alliances"],1,
 "It has been invoked exactly once, by the United States after 11 September 2001. The 2 per cent spending figure people often quote is a political pledge agreed at a summit, not part of the treaty.",["nato","cfr"]],

/* World: geography and affairs */
["geo",1,"The largest country by land area is:",["Canada","China","Russia","The United States"],2,
 "Russia covers about an eighth of the world's inhabited land and eleven time zones. Its size explains a lot: long indefensible borders, huge transport costs, and resources concentrated far from its people.",["cfr","owidPop"]],
["geo",2,"Which river has the world's largest drainage basin?",["The Nile","The Amazon","The Congo","The Yangtze"],1,
 "The Amazon carries roughly a fifth of all the river water that reaches the oceans. The Nile is the rival for longest — a different and genuinely disputed measurement.",["owidCO2","cfr"]],
["geo",2,"The Strait of Hormuz connects:",["Red Sea and Mediterranean","Persian Gulf and Gulf of Oman","Black Sea and Aegean","Arabian Sea and Bay of Bengal"],1,
 "A narrow gap between Iran and Oman through which a very large share of the world's seaborne oil passes. Any threat to it moves the oil price within hours, which gives it political weight far beyond its size.",["cfrHormuz","unctad"]],
["geo",1,"The Suez Canal links:",["Mediterranean and Red Sea","Atlantic and Pacific","Black Sea and Mediterranean","Red Sea and Persian Gulf"],0,
 "It saves weeks on the journey between Asia and Europe. When a ship blocked it in 2021, and again when Red Sea attacks pushed traffic around Africa, freight rates showed exactly how few alternatives exist.",["unctad","cfr"]],
["geo",1,"Which continent has the most countries?",["Asia","Africa","Europe","South America"],1,
 "Fifty-four. In the UN General Assembly, where every state has one vote, that bloc matters a great deal — and it explains why the African Union's admission to the G20 in 2023 was treated as significant.",["cfr","sdg"]],
["geo",1,"The most populous country in the world is:",["China","India","The United States","Indonesia"],1,
 "India passed China in 2023. The two are now on opposite paths: China's population has started falling, while India's keeps growing for another couple of decades before it levels off.",["owidPop","hdr"]],
["geo",2,"The Strait of Malacca matters because it is:",["An Atlantic-Pacific link","The main sea route between the Indian and Pacific Oceans","The Australia-Asia border","A Red Sea-Gulf link"],1,
 "Almost everything shipped between the Gulf, India and East Asia passes between Indonesia, Malaysia and Singapore. For energy importers like China and Japan, that narrow channel is a permanent strategic worry.",["unctad","orfQuad"]],
["geo",2,"The permanent members of the UN Security Council are:",["US, UK, France, Russia, China","The G7","US, Russia, China, India, Brazil","Elected every five years"],0,
 "The victors of 1945, each with a veto. The veto is why the Council is so often deadlocked — and also why the major powers stayed inside the UN instead of walking out of it.",["cfrUNSC","udhr"]],
["geo",1,"The United Nations was founded in:",["1919","1945","1948","1950"],1,
 "The Charter was signed in San Francisco as the Second World War ended. It started with 51 members and now has 193, most of the growth coming from decolonisation.",["udhr","cfr"]],
["geo",2,"The WTO was created in 1995 to replace:",["The OECD","GATT","UNCTAD","The ITO"],1,
 "The old tariff agreement became a proper organisation with a court that could rule against powerful members. That court's appeals stage has since been paralysed, because the United States has blocked new appointments.",["wto","cgdODA"]],
["geo",2,"The Quad groups India with:",["The US, Japan and Australia","China, Russia and Brazil","The UK, France and Germany","Indonesia, Vietnam and Singapore"],0,
 "Four democracies around the Indian and Pacific Oceans. It is deliberately not an alliance — there is no obligation to defend one another — and its agenda ranges from maritime security to vaccines and chips.",["orfQuad","carnegieNPT"]],
["geo",3,"India's position on the Nuclear Non-Proliferation Treaty is that it:",["Signed in 1968","Has never signed","Signed but never ratified","Withdrew in 1998"],1,
 "India refuses on principle: the treaty lets five countries keep nuclear weapons and forbids everyone else. The 2008 nuclear deal with the United States sidestepped the impasse without resolving the argument.",["carnegieNPT","cfr"]],
["geo",2,"'Soft power' means a country getting what it wants through:",["Attraction rather than force","Trade sanctions","Covert action","Alliance treaties"],0,
 "Joseph Nye's term for influence that comes from culture, values and institutions others admire. It is often used loosely to mean 'anything that isn't the army', which drains it of the meaning it was coined to carry.",["cfr","pbites"]],
["geo",2,"The Sahel is the band of land:",["North of the Sahara","South of the Sahara","Along the Nile","Around the Horn of Africa"],1,
 "A dry belt running from Senegal to Sudan between desert and savannah. Erratic rainfall, fast population growth and weak states have combined there into one of the hardest development problems anywhere.",["cgdODA","owidPov"]],

/* Economics and finance */
["fin",1,"When a central bank raises interest rates, it is trying to:",["Raise employment fast","Cool spending and inflation","Raise tax revenue","Boost exports"],1,
 "Dearer borrowing means less spending and investment, which eases pressure on prices. The effect takes several quarters to arrive, which is why central bankers set rates against a forecast rather than today's numbers.",["boeRates","imfBasics"]],
["fin",2,"When bond prices rise, yields:",["Rise too","Fall","Stay fixed","Turn negative"],1,
 "A bond pays a fixed sum each year. Pay more for that same fixed stream and your return is lower — so price up, yield down, always. It is the most useful single fact in finance.",["invBond","invYield"]],
["fin",3,"An inverted yield curve means:",["Long rates above short rates","Short rates above long rates","Negative yields","No trading"],1,
 "Normally you demand more to lend for longer. When short rates sit above long ones, investors are betting that rates — and usually growth — will fall. It has come before most US recessions, though not on any reliable timetable.",["invYield","boeRates"]],
["fin",1,"'Real' returns differ from 'nominal' returns because real returns are:",["Before tax","Adjusted for inflation","Measured in dollars","Guaranteed"],1,
 "Eight per cent growth with six per cent inflation is only two per cent in real terms. Nearly every argument about whether people are better off than a decade ago turns on which of the two is being quoted.",["imfBasics","owidGrowth"]],
["fin",1,"The rule of 72 tells you:",["Annual growth","How long something takes to double","Real returns","Loan interest"],1,
 "Divide 72 by the growth rate to get the doubling time: at 7 per cent a year, ten years. It is a quick way to test whether a claim about growth or compounding is plausible before reaching for a calculator.",["inv72","owidGrowth"]],
["fin",1,"One basis point is:",["0.1%","0.01%","1%","0.001%"],1,
 "A hundredth of a percentage point, so 25 basis points is a quarter point. The term exists to prevent a real ambiguity: 'rates rose 2 per cent' could mean from 4 to 6, or from 4 to 4.08.",["invBp"]],
["fin",1,"An index fund is designed to:",["Beat the market","Track an index cheaply","Hold only bonds","Hold one sector"],1,
 "It buys the whole market and charges very little. The argument for it is arithmetic: fees compound as relentlessly as returns, and few active managers beat their benchmark over twenty years.",["invIndex","boeRates"]],
["fin",2,"Diversification mainly reduces:",["Market-wide risk","Risk specific to individual holdings","Inflation risk","Currency risk"],1,
 "Spreading money across many holdings cancels out the things that hit one company. It cannot protect you from a general crash — that risk has to be borne, hedged, or avoided by not investing.",["invIndex","invMoral"]],
["fin",2,"Moral hazard is the problem that:",["People misjudge odds","Being shielded from consequences changes behaviour","Prices don't clear","Information costs money"],1,
 "If someone else carries the downside, you take risks you otherwise wouldn't. It is the reason every bank rescue is argued over: the rescue steadies the system now and teaches a lesson that causes trouble later.",["invMoral","imfBasics"]],
["fin",2,"Quantitative easing means a central bank:",["Cutting rates below zero","Buying assets to put money into the system","Printing banknotes","Lending straight to firms"],1,
 "Used when interest rates are already near zero and there is nothing left to cut. It pushes money into financial markets, which is also why its effect on asset prices — and so on wealth inequality — is so contested.",["boeQE","boeRates"]],
["fin",2,"The IMF differs from the World Bank in that the IMF:",["Funds long-term projects","Handles balance-of-payments and stability","Sets exchange rates","Is unconnected to the UN"],1,
 "The Fund is the emergency room for countries that cannot pay their foreign bills; the Bank finances long-term development. Both were created at Bretton Woods in 1944, and both still allocate votes on lines drawn then.",["imfBasics","cgdODA"]],
["fin",2,"Purchasing power parity adjusts for:",["Exchange rate swings","Differences in price levels between countries","Population","The informal economy"],1,
 "The same money buys more in Delhi than in London, so converting at market exchange rates makes poorer countries look poorer than they live. It is why India's economy ranks third on one measure and fifth on another.",["imfPPP","owidGrowth"]],
["fin",2,"The Gini coefficient measures:",["Depth of poverty","Income or wealth inequality","Growth volatility","Price levels"],1,
 "Zero would mean everyone has identical income, one that a single person has everything. It compresses a whole distribution into one number, so it cannot tell you whether the gap is at the top or the bottom.",["owidIneq","hdr"]],
["fin",1,"The Human Development Index is published by:",["The World Bank","UNDP","The OECD","The IMF"],1,
 "It combines life expectancy, schooling and income into one figure. Mahbub ul Haq built it with Amartya Sen precisely to stop countries being ranked on output alone.",["hdr","nobel98"]],
["fin",2,"A current account deficit means a country:",["Spends more abroad than it earns","Runs a budget deficit","Is devaluing","Has high inflation"],1,
 "The gap has to be funded by foreigners lending or investing. Whether that is dangerous depends on what the money is paying for and how quickly it could leave.",["imfCA","rbiMPC"]],
["fin",3,"GDP is an imperfect measure of welfare partly because it leaves out:",["Government spending","Unpaid household and care work","Exports","Investment"],1,
 "A meal cooked at home counts for nothing; the same meal bought counts as output. It also counts cleaning up damage as growth. These gaps shape which activities governments treat as valuable.",["owidGrowth","hdr"]],

/* Philosophy, logic, clear thinking */
["min",1,"The Socratic method works by:",["Lecturing from authority","Asking questions until contradictions appear","Running experiments","Formal proof"],1,
 "Socrates rarely asserted anything. He asked people who were confident about justice or courage to define it, then showed their definitions collapsing. The discomfort of that, not any doctrine, is what got him killed.",[SEP("socrates"),"pbites"]],
["min",2,"Kant's categorical imperative asks you to:",["Maximise happiness","Act only on a rule you could want everyone to follow","Follow convention","Trust your instincts"],1,
 "Ask what would happen if everyone did what you are about to do. Its strength is that it refuses to let you make a special case of yourself; its weakness shows when two such rules point opposite ways.",[SEP("kant-moral"),"pbites"]],
["min",1,"Utilitarianism judges an action by:",["Its intention","Its consequences for overall wellbeing","Its obedience to rules","The character of the agent"],1,
 "Bentham and Mill argued that the right act is the one producing the most good overall. Almost all cost-benefit analysis works this way, which is why criticism of utilitarianism is usually also criticism of how policy is made.",[SEP("utilitarianism-history"),"pbites"]],
["min",2,"Rawls's 'veil of ignorance' asks you to choose rules for society:",["By majority vote","Without knowing who you would be in it","From historical precedent","To maximise growth"],1,
 "If you did not know whether you would be born rich or poor, healthy or ill, you would design a society that protects the worst-off — because you might be them. It is the most influential thought experiment in modern political philosophy.",[SEP("rawls"),"pbites"]],
["min",1,"Plato's cave is an allegory about:",["Tyranny","The gap between appearance and reality","Language","Death"],1,
 "Prisoners watch shadows on a wall and take them for the world. One escapes, sees the real thing, and is disbelieved when he returns. Plato uses it to argue that most of us mistake surfaces for reality.",[SEP("plato"),"gutenberg"]],
["min",3,"Hume's 'is-ought' problem observes that:",["Facts are uncertain","You cannot derive what ought to be from what is","Morality is universal","Reason rules the passions"],1,
 "No pile of facts about the world by itself tells you what to do; a value has to be added somewhere. Spotting where that value quietly entered an argument is one of the most useful habits in reading policy writing.",[SEP("hume-moral"),"pbites"]],
["min",2,"Amartya Sen's capability approach measures wellbeing by:",["Income","What people are actually able to do and be","Reported happiness","Consumption"],1,
 "A woman with money but no safe way to travel to a clinic is not well off in any sense income captures. Sen's question is always what a person can actually do — and it is the idea behind the Human Development Index.",["nobel98",SEP("capability-approach")]],
["min",2,"Sartre's 'existence precedes essence' means:",["Biology is destiny","We have no fixed nature and must define ourselves","God made us","Society determines values"],1,
 "There is no blueprint for what a person is meant to be, so we are responsible for what we become — which he called a condemnation rather than a gift. 'Bad faith' is his name for the excuses we invent to escape it.",[SEP("existentialism"),"pbites"]],
["min",3,"Advaita Vedanta, associated with Shankara, holds that:",["Reality is fundamentally plural","Self and ultimate reality are not two different things","The world was made by gods","Ritual alone liberates"],1,
 "Advaita means 'not two': the individual self and ultimate reality are one, and the sense of separateness is a misperception. It is one strand of Vedanta among several, some of them firmly dualist.",["iepAdvaita","pbites"]],
["min",1,"An ad hominem argument attacks:",["The evidence","The person instead of the claim","The conclusion","The method"],1,
 "Someone's character can be relevant to whether you trust their testimony. It becomes a fallacy when it is offered as though it settled whether the claim is true.",[SEP("fallacies"),"oyc"]],
["min",1,"A straw man argument works by:",["Repeating a claim","Beating a weakened version of the other side's position","Citing authority","Changing the subject"],1,
 "You answer an argument nobody made. The corrective is to state the opposing case so well that its holder would sign off on your version, and only then reply to it.",[SEP("fallacies"),"pbites"]],
["min",2,"Base rate neglect means:",["Using old data","Ignoring how common something is to begin with","Sampling badly","Rounding wrongly"],1,
 "A test that is 99 per cent accurate for a disease affecting one person in ten thousand will still produce far more false positives than real cases, because there are so few real cases to find. Most misread medical statistics are this error.",["nobel02","oyc"]],
["min",2,"Popper argued a scientific claim must be:",["Provable","Falsifiable","Widely accepted","Mathematical"],1,
 "There must be some observation that would show it wrong. A theory that can absorb any result explains nothing. Philosophers of science have complicated this, but as a practical test it remains sharp.",[SEP("popper"),"oyc"]],
["min",2,"Goodhart's law says that:",["Data improves decisions","Once a measure becomes a target it stops measuring well","Metrics are political","Targets raise performance"],1,
 "Judge schools on one exam and teaching bends towards that exam; the score rises while learning may not. It is the first thing to think about when designing any target or results framework.",["ssirToC","jpal"]],
["min",2,"Regression to the mean explains why:",["Averages rise","Extreme results are usually followed by ordinary ones","Samples are biased","Trends speed up"],1,

["min",2,"Survivorship bias is the error of:",["Over-sampling the old","Looking only at the cases that made it through","Ignoring outliers","Using stale data"],1,

/* Development sector */
["dev",1,"Qualifying Indian companies must spend on CSR:",["1% of turnover","2% of average net profits of the past three years","5% of profits","A negotiated sum"],1,

["dev",1,"FCRA governs:",["Corporate donations","Foreign funding received by Indian organisations","Tax exemption for trusts","Foreign investment"],1,

["dev",1,"An endowment works by:",["Spending the gift in one year","Investing a corpus and spending the returns","Matching donations","Lending to grantees"],1,

["dev",1,"The Giving Pledge asks signatories to:",["Give a fixed sum yearly","Commit most of their wealth to philanthropy","Fund education only","Match public grants"],1,
 "It is a public promise, not a contract, begun in 2010. Its real work is changing what is expected of very wealthy people — and the letters signatories write to explain themselves are revealing documents in their own right.",["pledge","dasra"]],
["dev",3,"Catalytic capital is money that:",["Goes only to large organisations","Takes more risk or less return so other money will follow","Must be repaid in a year","Comes only from governments"],1,

["dev",3,"In a development impact bond:",["Government borrows to fund services","An investor pays upfront and an outcome funder repays if results are met","Donors pool grants","People get cash directly"],1,
 "The delivery risk sits with the investor, and the donor pays only for outcomes that are independently verified. The catch is that verification is expensive, and can swallow the efficiency it was meant to create.",["cgdDIB","ssirCat"]],
["dev",2,"'Retail giving' means:",["Giving by retailers","Many people giving small amounts","Checkout round-ups","Corporate matching"],1,

["dev",2,"Unrestricted funding matters to non-profits mainly because it:",["Is bigger","Pays for core costs and allows them to adapt","Is easier to report","Needs no reporting"],1,

["dev",2,"A randomised controlled trial shows cause and effect by:",["Surveying many people","Randomly deciding who gets the programme","Comparing before and after","Adjusting for known differences"],1,

["dev",2,"Effective altruism's central claim is that:",["All charities are equal","Evidence and reasoning should decide where resources do most good","Giving should be local","Only cash transfers work"],1,

["dev",1,"How many Sustainable Development Goals are there, and by when?",["8 by 2015","15 by 2025","17 by 2030","20 by 2040"],2,

["dev",2,"The Paris Agreement commits signatories to:",["Ending fossil fuels by 2050","Holding warming well below 2C while pursuing 1.5C","A global carbon tax","Binding national caps"],1,

["dev",3,"For the OECD, official development assistance must be:",["Any spending abroad","Concessional and aimed at development","Routed through the UN","Repaid in ten years"],1,

["tec",2,"Software is open source, strictly speaking, when:",["The code can be read","Anyone may use, change and redistribute it","It costs nothing","Nobody owns it"],1,

["tec",1,"'India Stack' refers to:",["A government cloud service","Layered public digital infrastructure: identity, payments and consented data sharing","A startup programme","India's semiconductor plan"],1,

["tec",1,"Chandrayaan-3 was notable in 2023 for:",["India's first lunar orbiter","The first soft landing near the Moon's south pole","Carrying a crew","Returning samples"],1,

let CARDS=[];
function makeCards(){
 CARDS=Q.concat((D&&D.custom)||[]).map((q,i)=>({id:i,sec:q[0],lvl:q[1],q:q[2],
   opts:q[3],a:q[4],why:q[5],src:q[6]||[],gen:!!q[7]}));
}
const GAP=[0,1,3,7,16,35], SIZE=12, KEY="gkiw3";
const MEDALS=[
 {id:"ten",t:"First ten",i:"✓",f:s=>s.correct>=10},
 {id:"fifty",t:"Fifty right",i:"✓✓",f:s=>s.correct>=50},
 {id:"hund",t:"Hundred right",i:"★",f:s=>s.correct>=100},
 {id:"r3",t:"Three days running",i:"3",f:s=>(s.best||0)>=3},
 {id:"r7",t:"A full week",i:"7",f:s=>(s.best||0)>=7},
 {id:"perf",t:"A perfect set",i:"◎",f:s=>(s.perfect||0)>=1},
 {id:"run8",t:"Eight in a row",i:"⚡",f:s=>(s.bestRun||0)>=8},
 {id:"sec",t:"A section settled",i:"◆",f:()=>SECS.some(x=>done(x.id))},
 {id:"all",t:"Every section",i:"◈",f:()=>SECS.every(x=>CARDS.some(c=>c.sec===x.id&&D.cards[c.id]&&D.cards[c.id].right>0))}
];

let D={cards:{},off:[],streak:0,best:0,last:null,points:0,correct:0,perfect:0,bestRun:0,medals:[],stars:[],theme:"auto",prov:"gemini",key:"",model:"",gkey:"",gmodel:"",chats:{},custom:[]};
let view="today",sess=null,fSec="all",fQ="",fStar=false,openId=null;

const day=()=>{const d=new Date();return Math.floor((d-new Date(d.getFullYear(),0,0))/864e5)+d.getFullYear()*1000;};
const ds=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const cst=id=>D.cards[id]||{box:0,due:0,seen:0,right:0};
const isOn=id=>!D.off.includes(id);
const inS=id=>CARDS.filter(c=>c.sec===id);
const dueN=id=>inS(id).filter(c=>!D.cards[c.id]||D.cards[c.id].due<=day()).length;
const gotN=id=>inS(id).filter(c=>D.cards[c.id]&&D.cards[c.id].box>=3).length;
const done=id=>inS(id).length&&gotN(id)===inS(id).length;
const met=()=>CARDS.filter(c=>D.cards[c.id]);
const save=()=>Store.set(KEY,JSON.stringify(D));

function applyTheme(){
  const t=D.theme==="auto"
    ?(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")
    :D.theme;
  document.documentElement.setAttribute("data-theme",t);
}
if(window.matchMedia)try{window.matchMedia("(prefers-color-scheme: dark)")
  .addEventListener("change",()=>{if(D.theme==="auto")applyTheme();});}catch(e){}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function build(){
 const d=day(),pool=CARDS.filter(c=>isOn(c.sec));
 const due=shuffle(pool.filter(c=>D.cards[c.id]&&D.cards[c.id].due<=d));
 const nw=shuffle(pool.filter(c=>!D.cards[c.id]));
 let l=due.slice(0,SIZE);
 if(l.length<SIZE)l=l.concat(nw.slice(0,SIZE-l.length));
 if(!l.length)l=shuffle(pool.slice()).slice(0,SIZE);
 sess={list:l,i:0,res:[],run:0,gain:0,done:false};
}
function grade(ok){
 const c=sess.list[sess.i],s=cst(c.id),box=ok?Math.min(s.box+1,5):1;
 D.cards[c.id]={box,due:day()+GAP[box],seen:s.seen+1,right:s.right+(ok?1:0)};
 let p=0;
 if(ok){sess.run++;D.correct++;p=10+Math.min((sess.run-1)*2,10)+(c.lvl-1)*3;
   D.points+=p;sess.gain+=p;D.bestRun=Math.max(D.bestRun||0,sess.run);}
 else sess.run=0;
 sess.res.push({id:c.id,ok});return p;
}
function finish(){
 if(D.last!==ds()){
   const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
   D.streak=(D.last===y)?D.streak+1:1;D.last=ds();D.best=Math.max(D.best||0,D.streak);}
 if(sess.res.every(r=>r.ok))D.perfect=(D.perfect||0)+1;
 const got=MEDALS.filter(m=>!D.medals.includes(m.id)&&m.f(D)).map(m=>m.id);
 D.medals=D.medals.concat(got);save();return got;
}

 const myKey=()=>((prov()==="claude"?D.key:D.gkey)||"").trim();
 const GBASE="https://generativelanguage.googleapis.com/v1beta/";
 // fallbacks, newest first — Google retires model names, so the app also asks the key what it can run
 const GFALL=["gemini-3.8-flash","gemini-3.1-flash-lite","gemini-flash-latest",
              "gemini-3-flash-preview","gemini-2.5-flash","gemini-2.5-flash-lite"];
 function gerr(status,msg){
   const e=new Error(msg||("HTTP "+status));
   const m=msg||"";
   e.code = /API key not valid|API_KEY_INVALID/i.test(m) ? "bad_key"
          : status===401||status===403 ? "bad_key"
          : status===429 ? "rate_limited"
          : status===404||/not found|not supported|unsupported|does not exist/i.test(m) ? "model"
          : "http";
   return e;
 }
 // ask the key which models it may actually use, and pick a sensible flash one
 async function gmodels(){
   const key=myKey();
   if(!key){const e=new Error("no key");e.code="no_key";throw e;}
   const r=await fetch(GBASE+"models?pageSize=200",{headers:{"x-goog-api-key":key}});
   if(!r.ok){let m="";try{m=(await r.json()).error.message;}catch(e){}throw gerr(r.status,m);}
   const j=await r.json();
   return (j.models||[])
     .filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent"))
     .map(m=>String(m.name||"").replace(/^models\//,""))
     .filter(n=>/flash/i.test(n) && !/image|tts|audio|live|embed|vision|thinking|omni/i.test(n));
 }
 function gpick(names){
   const score=n=>{
     let s=0;
     const v=(n.match(/gemini-(\d+(?:\.\d+)?)/)||[])[1];
     if(v)s+=parseFloat(v)*100;
     if(/lite/i.test(n))s+=5;            // lite has the friendliest free limits
     if(/preview|exp/i.test(n))s-=40;    // prefer stable
     if(/latest/i.test(n))s-=10;
     if(/-\d{2}-\d{2}$/.test(n))s-=20;   // prefer the undated alias
     return s;
   };
   return names.slice().sort((a,b)=>score(b)-score(a))[0];
 }
 async function gcall(body,model,key){
   const r=await fetch(GBASE+"models/"+model+":generateContent",{
     method:"POST",
     headers:{"content-type":"application/json","x-goog-api-key":key},
     body:JSON.stringify(body)});
   if(!r.ok){let m="";try{m=(await r.json()).error.message;}catch(e){}throw gerr(r.status,m);}
   const j=await r.json();
   const c=(j.candidates||[])[0];
   const t=(((c||{}).content||{}).parts||[]).map(x=>x.text||"").join("").trim();
   if(!t){const e=new Error("the model returned nothing");e.code="empty";throw e;}
   return t;
 }
 async function gemini(body,model){
   const key=myKey();
   if(!key){const e=new Error("no key");e.code="no_key";throw e;}
   const set=(D.gmodel||"").trim();
   const tries=model?[model]:(set?[set]:GFALL.slice());
   let last=null;
   for(const m of tries){
     try{
       const t=await gcall(body,m,key);
       if(!model&&!set){D.gmodel=m;save();}   // remember whichever worked
       return t;
     }catch(e){ last=e; if(e.code!=="model")throw e; }
   }
   if(!model&&set){                            // a stored name went stale — clear it and retry once
     D.gmodel="";save();
     return gemini(body);
   }
   throw last||gerr(404,"no usable model");
 }
 async function viaKey(turns,sys,onText){
   if(prov()==="gemini"){
     const t=await gemini({
       system_instruction:{parts:[{text:sys}]},
       contents:turns.map(x=>({role:x.role==="assistant"?"model":"user",parts:[{text:x.content}]})),
       generationConfig:{maxOutputTokens:900}});
     if(onText)onText(t);
     return t;
   }
   const key=(D.key||"").trim();
   if(!key){const e=new Error("no key");e.code="no_key";throw e;}
   const r=await fetch("https://api.anthropic.com/v1/messages",{
     method:"POST",
     headers:{"content-type":"application/json","x-api-key":key,
       "anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
     body:JSON.stringify({model:(D.model||"claude-sonnet-5").trim(),max_tokens:800,
       system:sys,messages:turns})});
   if(!r.ok){
     let m="";try{m=(await r.json()).error.message;}catch(e){}
     const e=new Error(m||("HTTP "+r.status));e.code=r.status===401?"bad_key":"http";throw e;}
   const j=await r.json();
   const t=(j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").trim();
   if(onText)onText(t);
   return t;
 }
 return{
  async host(){await ready;return !!ns;},
  async pickModel(){
    const names=await gmodels();
    if(!names.length){const e=new Error("this key has no text models enabled");e.code="model";throw e;}
    const m=gpick(names);
    D.gmodel=m; await save();
    return m;
  },
  async usable(){await ready;return !!ns||!!myKey();},
  async askJSON(prompt,search){
    await ready;
    if(ns&&!search){
      return await ns.json(prompt,{modelTier:"default"});
    }
    if(prov()==="gemini"){
      const gb={contents:[{role:"user",parts:[{text:prompt}]}],
        generationConfig:{maxOutputTokens:8000}};
      if(search)gb.tools=[{google_search:{}}];
      else gb.generationConfig.responseMimeType="application/json";
      let t;
      try{ t=await gemini(gb); }
      catch(e){
        if(search&&e.code==="http"){
          const gb2={contents:[{role:"user",parts:[{text:prompt}]}],
            generationConfig:{maxOutputTokens:8000,responseMimeType:"application/json"}};
          t=await gemini(gb2);
        } else throw e;
      }
      t=t.replace(/^[\s\S]*?```(?:json)?/,"").replace(/```[\s\S]*$/,"").trim();
      const i=t.indexOf("["),k=t.lastIndexOf("]");
      if(i<0||k<i){const e=new Error("no json");e.code="bad_json";throw e;}
      return JSON.parse(t.slice(i,k+1));
    }
    const key=(D.key||"").trim();
    if(!key){const e=new Error("no key");e.code=search?"no_key_search":"no_key";throw e;}
    const body={model:(D.model||"claude-sonnet-5").trim(),max_tokens:4000,
      messages:[{role:"user",content:prompt}]};
    if(search)body.tools=[{type:"web_search_20250305",name:"web_search"}];
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
      headers:{"content-type":"application/json","x-api-key":key,
        "anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify(body)});
    if(!r.ok){let m="";try{m=(await r.json()).error.message;}catch(e){}
      const e=new Error(m||("HTTP "+r.status));e.code=r.status===401?"bad_key":"http";throw e;}
    const j=await r.json();
    let t=(j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
    t=t.replace(/^[\s\S]*?```(?:json)?/,"").replace(/```[\s\S]*$/,"").trim();
    const a=t.indexOf("["),z=t.lastIndexOf("]");
    if(a<0||z<a){const e=new Error("no json");e.code="bad_json";throw e;}
    return JSON.parse(t.slice(a,z+1));
  },
  async ask(turns,sys,onText){
    await ready;
    if(ns){
      const r=await ns([{role:"user",content:sys},...turns],
        {cache:false,onText:onText?(({text})=>onText(text)):undefined});
      return r.text;
    }
    return viaKey(turns,sys,onText);
  }};
})();

function aiBrief(c){
 const s=SECS.find(x=>x.id===c.sec);
 const reading=c.src.map(k=>{const v=src(k);return v?("- "+v[0]+" ("+v[1]+")"):"";}).filter(Boolean).join("\n");
 return "You are helping someone revise general knowledge inside a small quiz app. "+
 "They have just answered this question and want to understand it better.\n\n"+
 "SECTION: "+s.n+"\nQUESTION: "+c.q+"\nOPTIONS: "+c.opts.join(" / ")+
 "\nCORRECT ANSWER: "+c.opts[c.a]+"\nTHE APP'S NOTE: "+c.why+
 (reading?("\nFURTHER READING ALREADY SHOWN: \n"+reading):"")+"\n\n"+
 "Answer their follow-up questions about this. Keep to roughly 120 words unless they ask for more. "+
 "Use British English, plain prose, no headings, no bullet points unless a list is genuinely clearer. "+
 "Be concrete: dates, names, mechanisms. If something is contested, say so briefly and give both readings. "+
 "If you are not certain, say so rather than inventing detail. Never invent web links or paper titles. "+
 "Stay on this topic and what it connects to.";
}
const STARTERS=["Why does this matter?","Give me an example","What's the common misconception?","What should I read next?"];

function mountAI(c,slot){
 const el=document.getElementById(slot); if(!el)return;
 D.chats=D.chats||{};
 const turns=D.chats[c.id]||[];
 const draw=()=>{
  el.innerHTML='<div class="ai"><h3>Ask about this</h3>'+
   '<div class="thread" id="th">'+turns.map(t=>
     '<div class="bub '+(t.role==="user"?"me":"ai")+'">'+esc(t.content)+'</div>').join("")+'</div>'+
   (turns.length?'':'<div class="starters">'+STARTERS.map((s,i)=>
     '<button class="starter" data-s="'+i+'">'+s+'</button>').join("")+'</div>')+
   '<div class="askrow"><input id="ai-in" placeholder="Ask a follow-up" autocomplete="off">'+
   '<button id="ai-go">Ask</button></div>'+
   '<p class="hint" id="ai-hint"></p></div>';
  el.querySelectorAll(".starter").forEach(b=>b.onclick=()=>send(STARTERS[+b.dataset.s]));
  const inp=el.querySelector("#ai-in"),go=el.querySelector("#ai-go");
  go.onclick=()=>send(inp.value);
  inp.onkeydown=e=>{if(e.key==="Enter")send(inp.value);};
  AI.usable().then(ok=>{
   const h=el.querySelector("#ai-hint");
   if(!ok&&h)h.textContent="Add a free API key under Progress to ask follow-up questions here.";
  });
 };
 async function send(text){
  text=(text||"").trim(); if(!text)return;
  turns.push({role:"user",content:text});
  D.chats[c.id]=turns; draw();
  const th=el.querySelector("#th"),go=el.querySelector("#ai-go"),
        inp=el.querySelector("#ai-in"),hint=el.querySelector("#ai-hint");
  inp.value="";go.disabled=true;
  const bub=document.createElement("div");
  bub.className="bub ai wait";bub.textContent="Thinking…";th.appendChild(bub);
  bub.scrollIntoView({block:"nearest"});
  try{
   const out=await AI.ask(turns.slice(-10),aiBrief(c),t=>{
     bub.className="bub ai";bub.textContent=t;});
   bub.className="bub ai";bub.textContent=out;
   turns.push({role:"assistant",content:out});
   if(turns.length>12)turns.splice(0,turns.length-12);
   D.chats[c.id]=turns;
   const keys=Object.keys(D.chats);
   if(keys.length>25)delete D.chats[keys[0]];
   save();draw();
  }catch(e){
   turns.pop();D.chats[c.id]=turns;
   bub.remove();go.disabled=false;
   hint.textContent =
     e&&e.code==="no_key" ? "Add an API key under Progress to ask follow-up questions here."
     : e&&e.code==="bad_key" ? "That API key was rejected. Check it under Progress."
     : e&&e.code==="not_granted" ? "This view isn't allowed to ask Claude."
     : e&&e.code==="rate_limited" ? "Too many questions at once — try again shortly."
     : "Couldn't get an answer just then. Try again.";
   return;
  }
 }
 draw();
}

function unseen(){return CARDS.filter(c=>!D.cards[c.id]).length;}

function genPrompt(secId,n,search){
 const s=SECS.find(x=>x.id===secId);
 const have=CARDS.filter(c=>c.sec===secId).slice(-40).map(c=>"- "+c.q).join("\n");
 return (search
   ? "Search the web for notable developments of the last three months, then write "+n+
     " multiple-choice questions about them. Choose things whose answers will still be correct in a year: "+
     "treaties signed, elections decided, prizes awarded, laws passed, missions launched, landmark rulings. "+
     "Avoid anything still unfolding, and avoid predictions.\n\n"
   : "Write "+n+" multiple-choice general-knowledge questions for an adult revision app.\n\n")+
 "SECTION: "+s.n+"\n\n"+
 "House style, follow it closely:\n"+
 "- Exactly four options, one unambiguously correct, the wrong ones plausible rather than silly.\n"+
 "- An explanation of two or three plain sentences in British English that says WHY it matters or how it works, never just restating the answer.\n"+
 "- No headings, no bullet points, no rhetorical questions.\n"+
 "- Mix difficulty: some foundational, some harder.\n"+
 (have?("\nDo not repeat these, which the app already has:\n"+have+"\n"):"")+
 "\nReply with ONLY a JSON array, no prose around it. Each item:\n"+
 '{"lvl":1,"q":"...","opts":["a","b","c","d"],"a":0,"why":"...","src":[{"t":"title of a specific article, paper, report, podcast or video","w":"publication and year","k":"essay","find":"a search phrase that finds it"}]}\n'+
 "lvl is 1, 2 or 3. a is the index of the correct option. One or two sources each, real and specific. "+
 "Never invent a web address: give the title and where it appeared, and a search phrase in 'find'.";
}

function domainOf(u){try{return new URL(u).hostname.replace(/^www\./,"");}catch(e){return "";}}

function tidy(raw,secId){
 const out=[];
 (Array.isArray(raw)?raw:[]).forEach(r=>{
  if(!r||typeof r.q!=="string")return;
  const o=r.opts;
  if(!Array.isArray(o)||o.length!==4||o.some(x=>typeof x!=="string"||!x.trim()))return;
  const a=Number(r.a);
  if(!(a>=0&&a<=3))return;
  if(typeof r.why!=="string"||r.why.trim().length<40)return;
  if(CARDS.some(c=>c.q.trim().toLowerCase()===r.q.trim().toLowerCase()))return;
  const srcs=(Array.isArray(r.src)?r.src:[]).slice(0,2).map(v=>{
    if(!v||!v.t)return null;
    const url=(typeof v.url==="string"&&/^https:\/\//.test(v.url))?v.url:null;
    return [String(v.t).slice(0,150), String(v.w||"").slice(0,90), String(v.k||"reading").slice(0,20),
            url||g(String(v.find||(v.t+" "+(v.w||""))).slice(0,180)),
            url?domainOf(url):"search"];
  }).filter(Boolean);
  const lvl=[1,2,3].includes(Number(r.lvl))?Number(r.lvl):2;
  out.push([secId,lvl,r.q.trim(),o.map(x=>x.trim()),a,r.why.trim(),srcs,true]);
 });
 return out;
}

let genSec="now", genN=6, genBusy=false, genMsg="";
function mountGen(){
 const el=document.getElementById("gen"); if(!el)return;
 const list=SECS.slice();
 el.innerHTML='<div class="ai"><h3>Fresh questions</h3>'+
  '<p class="hint" style="margin:0 0 10px">'+unseen()+' of '+CARDS.length+
  ' you have not seen yet. Claude can write more in any section, and search the news for topical ones.</p>'+
  '<div class="starters" id="gsec">'+list.map(s=>'<button class="starter'+(s.id===genSec?" pick":"")+
    '" data-s="'+s.id+'">'+(s.id==="now"?"Recent and topical":s.n)+'</button>').join("")+'</div>'+
  '<div class="askrow"><button class="starter'+(genN===6?" pick":"")+'" data-n="6">6 questions</button>'+
  '<button class="starter'+(genN===12?" pick":"")+'" data-n="12">12 questions</button></div>'+
  '<button class="btn" id="gwrite" style="margin-top:12px"'+(genBusy?" disabled":"")+'>'+
   (genBusy?"Writing…":(genSec==="now"?"Search the news and write":"Write new questions"))+'</button>'+
  '<p class="hint" id="gmsg">'+esc(genMsg)+'</p></div>';
 el.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{genSec=b.dataset.s;genMsg="";mountGen();});
 el.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{genN=+b.dataset.n;mountGen();});
 el.querySelector("#gwrite").onclick=run;

 async function run(){
  genBusy=true;genMsg="Thinking. This takes up to a minute.";mountGen();
  try{
   const search=genSec==="now";
   const raw=await AI.askJSON(genPrompt(genSec,genN,search),search);
   const fresh=tidy(raw,genSec);
   if(!fresh.length){genMsg="Nothing usable came back. Try again.";}
   else{
    D.custom=(D.custom||[]).concat(fresh);
    if(D.custom.length>400)D.custom=D.custom.slice(-400);
    makeCards();await save();
    genMsg=fresh.length+" added to "+SECS.find(x=>x.id===genSec).n+". They are in today's pool now.";
   }
  }catch(e){
   genMsg = e&&e.code==="no_key_search"
     ? "Searching the news needs your own API key — add one under Progress. It only works outside Claude."
     : e&&e.code==="no_key" ? "Add an API key under Progress to write new questions."
     : e&&e.code==="bad_key" ? "That API key was rejected. Check it under Progress."
     : e&&e.code==="bad_json" ? "The reply came back malformed. Try again."
     : e&&e.code==="not_granted" ? "This view isn't allowed to ask Claude."
     : e&&e.code==="rate_limited" ? "Hit the free tier's rate limit. Wait a minute and try again."
     : "That didn't work. Try again.";
  }
  genBusy=false;mountGen();
 }
}
